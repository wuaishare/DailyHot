name: Bug 报告
description: 报告源码、部署、兼容性或功能异常
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。这里用于开源项目工程问题；如果是吾爱热榜线上内容、数据源或产品体验建议，请优先使用反馈中心。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 清楚说明发生了什么，以及问题对使用的影响。
      placeholder: 请描述实际遇到的问题。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供可以稳定复现问题的最小步骤。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 你期望看到什么结果？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 实际发生了什么？
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - hot.wuaishare.cn
        - Vercel 自托管
        - 本地开发环境
        - 其他平台/自建服务器
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / Build Number
      description: 可从站点页脚复制，例如 v1.4.8 (YYMMDDHHMM)。
      placeholder: v1.4.8 (YYMMDDHHMM)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器与操作系统
      placeholder: Chrome 151 / macOS 15，或 Safari / iOS 等
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、日志或补充信息
      description: 可粘贴必要日志或拖入截图。请先删除 Token、Cookie、密码、API Key 等敏感信息。
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 我已检查并移除 Token、Cookie、密码、API Key、数据库凭据等敏感信息。
          required: true
